<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>NordicWatch v0.3</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
:root{
 --bg:#07101c;
 --panel:rgba(11,18,32,.95);
 --border:rgba(255,255,255,.09);
 --text:#edf4ff;
 --muted:#8ea0b8;
 --accent:#61dafb;
 --warn:#f7c948;
 --danger:#ff6b6b;
 --ok:#55d187
}

*{box-sizing:border-box}

html,body{
 margin:0;
 min-height:100%;
 background:var(--bg);
 color:var(--text);
 font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif
}

header{
 padding:14px 16px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 border-bottom:1px solid var(--border);
 background:#08111f
}

h1,h2{margin:0}

.eye{
 font-size:10px;
 letter-spacing:1.4px;
 color:var(--muted);
 margin-bottom:4px
}

.score{
 border:1px solid var(--border);
 border-radius:12px;
 padding:7px 10px;
 color:var(--muted);
 font-size:11px
}

.score b{
 font-size:22px;
 color:var(--warn);
 margin-left:8px
}

.toolbar{
 padding:9px 10px;
 display:flex;
 justify-content:space-between;
 gap:8px;
 border-bottom:1px solid var(--border);
 overflow:auto
}

.ranges{display:flex;gap:5px}

button{
 border:1px solid var(--border);
 background:rgba(255,255,255,.04);
 color:var(--text);
 padding:8px 10px;
 border-radius:9px
}

button.on,.primary{
 border-color:rgba(97,218,251,.4);
 background:rgba(97,218,251,.13)
}

main{
 display:grid;
 grid-template-columns:minmax(0,1.6fr) minmax(300px,.8fr)
}

#map{
 height:calc(100vh - 122px);
 min-height:600px;
 background:#08111d
}

.mapwrap{position:relative}

.layers{
 position:absolute;
 z-index:500;
 top:10px;
 left:10px;
 background:var(--panel);
 border:1px solid var(--border);
 border-radius:13px;
 padding:12px;
 font-size:11px;
 max-width:310px
}

.layers.closed{display:none}

.layerhead{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:6px
}

.layers label{
 display:block;
 margin:7px 0
}

#hideLayers{
 font-size:18px;
 padding:3px 9px
}

#showLayers{
 position:absolute;
 z-index:490;
 top:10px;
 left:10px
}

.status{
 margin-top:8px;
 padding-top:8px;
 border-top:1px solid var(--border);
 color:var(--muted);
 line-height:1.35
}

.status b{color:var(--accent)}

.filterbar{
 display:flex;
 flex-wrap:wrap;
 gap:4px;
 margin-top:7px
}

.filterbar button{
 padding:5px 7px;
 font-size:10px
}

.filterbar button.on{
 background:rgba(97,218,251,.16)
}

.side{
 padding:10px;
 border-left:1px solid var(--border)
}

.card{
 background:var(--panel);
 border:1px solid var(--border);
 border-radius:14px;
 padding:13px;
 margin-bottom:10px
}

.head{
 display:flex;
 justify-content:space-between
}

.live{color:var(--danger)}

.signal,.hot{
 padding:11px 0;
 border-top:1px solid var(--border)
}

.signal:first-of-type,.hot:first-of-type{
 border-top:0
}

.meta{
 font-size:10px;
 color:var(--muted);
 margin-bottom:4px
}

.title{
 font-size:13px;
 font-weight:700
}

.desc{
 font-size:11px;
 color:#b8c4d4;
 margin-top:4px;
 line-height:1.4
}

.hot{
 display:flex;
 justify-content:space-between;
 gap:8px
}

.hot b{font-size:13px}

.hot small{
 display:block;
 color:var(--muted);
 margin-top:3px
}

.n{
 font-size:17px;
 font-weight:800
}

.hi{color:var(--danger)}
.med{color:var(--warn)}
.lo{color:var(--ok)}

.drawer{
 display:none;
 position:fixed;
 z-index:2000;
 inset:0;
 background:rgba(0,0,0,.7);
 align-items:flex-end
}

.drawer.show{display:flex}

.sheet{
 width:100%;
 max-height:72vh;
 overflow:auto;
 background:#0b1423;
 border-radius:18px 18px
