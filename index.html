<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">

<title>NordicWatch v0.5</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
 <style>
:root{--bg:#07101c;--panel:rgba(11,18,32,.95);--border:rgba(255,255,255,.09);--text:#edf4ff;--muted:#8ea0b8;--accent:#61dafb;--warn:#f7c948;--danger:#ff6b6b;--ok:#55d187}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);background:#08111f}
h1,h2{margin:0}.eye{font-size:10px;letter-spacing:1.4px;color:var(--muted);margin-bottom:4px}.score{border:1px solid var(--border);border-radius:12px;padding:7px 10px;color:var(--muted);font-size:11px}.score b{font-size:22px;color:var(--warn);margin-left:8px}
.toolbar{padding:9px 10px;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--border);overflow:auto}.ranges{display:flex;gap:5px}
button{border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);padding:8px 10px;border-radius:9px}button.on,.primary{border-color:rgba(97,218,251,.4);background:rgba(97,218,251,.13)}
main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,.8fr)}#map{height:calc(100vh - 122px);min-height:600px;background:#08111d}.mapwrap{position:relative}
.layers{position:absolute;z-index:500;top:10px;left:10px;background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:9px 11px;font-size:11px;max-width:245px}.layers label{display:block;margin:7px 0}
 .layers-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.layers-toggle{padding:2px 7px;font-size:16px;line-height:1}.layers.collapsed .layers-body{display:none}
.status{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);color:var(--muted);line-height:1.35}.status b{color:var(--accent)}
.filterbar{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}.filterbar button{padding:5px 7px;font-size:10px}.filterbar button.on{background:rgba(97,218,251,.16)}
.side{padding:10px;border-left:1px solid var(--border)}.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:13px;margin-bottom:10px}.head{display:flex;justify-content:space-between}.live{color:var(--danger)}
.signal,.hot{padding:11px 0;border-top:1px solid var(--border)}.signal:first-of-type,.hot:first-of-type{border-top:0}.meta{font-size:10px;color:var(--muted);margin-bottom:4px}.title{font-size:13px;font-weight:700}.desc{font-size:11px;color:#b8c4d4;margin-top:4px;line-height:1.4}.hot{display:flex;justify-content:space-between;gap:8px}.hot b{font-size:13px}.hot small{display:block;color:var(--muted);margin-top:3px}.n{font-size:17px;font-weight:800}.hi{color:var(--danger)}.med{color:var(--warn)}.lo{color:var(--ok)}
.drawer{display:none;position:fixed;z-index:2000;inset:0;background:rgba(0,0,0,.7);align-items:flex-end}.drawer.show{display:flex}.sheet{width:100%;max-height:72vh;overflow:auto;background:#0b1423;border-radius:18px 18px 0 0;padding:17px}.sheethead{display:flex;justify-content:space-between}.change{padding:12px 0;border-top:1px solid var(--border)}.change span{font-size:11px;color:var(--muted)}
.plane{font-size:22px;line-height:22px;text-shadow:0 0 5px #000}.leaflet-div-icon{background:transparent;border:0}
.cat-awacs{color:#ff9f43}.cat-tanker{color:#b388ff}.cat-isr{color:#ff6b6b}.cat-transport{color:#61dafb}.cat-fighter{color:#ffd166}.cat-other{color:#8ed1a5}
.legend{font-size:10px;color:var(--muted);margin-top:6px}.alertctl{margin-top:8px;display:flex;gap:5px;align-items:center}.alertctl button{padding:6px 8px;font-size:10px}.alertstate{font-size:10px;color:var(--muted)}
@media(max-width:850px){main{grid-template-columns:1fr}#map{height:58vh;min-height:430px}.side{border-left:0}.layers{font-size:10px}.toolbar{position:sticky;top:0;z-index:900;background:#07101c}}
</style>
</head>
<body>
<header><div><div class="eye">NORDIC OSINT SITUATIONAL AWARENESS · v0.5</div><h1>NordicWatch</h1></div><div class="score">Activity <b id="score">62</b></div></header>
<div class="toolbar"><div class="ranges"><button data-r="6h">6h</button><button class="on" data-r="24h">24h</button><button data-r="3d">3d</button><button data-r="7d">7d</button><button data-r="30d">30d</button></div><button class="primary" id="changed">What changed?</button></div>
<main>
<section class="mapwrap"><div id="map"><div class="layers" id="layersPanel"><div class="layers-head"><b>Layers</b><button class="layers-toggle" id="layersToggle">−</button></div><div class="layers-body">
<label><input type="checkbox" data-l="hotspots" checked> Hotspots</label>
<label><input type="checkbox" data-l="military" checked> Live military ✈</label>

<div class="filterbar" id="filters">
<button class="on" data-f="all">All</button><button data-f="awacs">AWACS</button><button data-f="tanker">Tanker</button><button data-f="isr">ISR</button><button data-f="transport">Transport</button><button data-f="fighter">Fighter</button>
</div>
<div class="status">ADSB: <b id="adsbStatus">loading…</b><br><span id="adsbUpdated"></span></div>
<div class="legend">Orange AWACS · Purple tanker · Red ISR · Blue transport · Yellow fighter</div>
<div class="alertctl"><button id="alertsBtn">Enable alerts</button><span class="alertstate" id="alertState">off</span></div>
</div></div></section>
<aside class="side"><div class="card"><div class="head"><div><div class="eye">LIVE SIGNALS</div><h2>Latest signals</h2></div><span class="live">●</span></div><div id="signals"></div></div><div class="card"><div class="eye">REGIONAL WATCH</div><h2>Hotspots</h2><div id="hots"></div></div></aside>
</main>
<div class="drawer" id="drawer"><div class="sheet"><div class="sheethead"><div><div class="eye">DELTA VIEW</div><h2>What changed?</h2></div><button id="close">Close</button></div><div id="changes"></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const D={
hotspots:[
["Kaliningrad / Baltijsk",54.71,20.51,82,
"Major Russian military hub on the Baltic Sea",
"Kaliningrad concentrates naval, air-defence and missile capabilities between NATO territory in Poland and Lithuania.",
"Unusual military air or naval activity · force dispersal · port activity · GNSS interference",
"HIGH"],
["Suwałki corridor",54.10,23.20,74,
"Strategic NATO land corridor",
"The narrow land connection between Poland and Lithuania links the Baltic states to the rest of NATO territory.",
"Military movements · air-defence activity · exercises · GNSS interference · unusual activity around Kaliningrad or Belarus",
"HIGH"],
["Kola / Murmansk",68.97,33.07,69,
"Russia's key Arctic military concentration",
"The Kola Peninsula hosts major Northern Fleet, submarine, air and strategic nuclear infrastructure close to NATO's northern flank.",
"Naval departures · strategic aviation · submarine activity · unusual air movements · force dispersal",
"HIGH"],
["Gulf of Finland",59.75,25.5,66,
"Strategic maritime gateway to the eastern Baltic",
"The Gulf of Finland concentrates shipping routes, energy infrastructure and military activity between Finland, Estonia and Russia.",
"Naval movements · unusual military aviation · GNSS interference · shipping disruptions · activity around St Petersburg and Kronstadt",
"HIGH"],
["Gotland",57.47,18.49,58,
"Strategic control point in the central Baltic",
"Gotland sits astride key Baltic air and sea routes and is important for surveillance, air defence and reinforcement of the Baltic states.",
"Unusual military aviation · naval movements · air-defence activity · exercises · GNSS interference",
"HIGH"],
["Narva",59.38,28.19,52,"Border and information pressure"],
["Bornholm",55.13,14.92,46,"Baltic sea-lane and ISR relevance"],
["Norwegian energy zone",61,3,44,"Critical offshore infrastructure","Major offshore oil and gas infrastructure linking Norway to European energy supply.","Unusual ISR or maritime patrol activity · GNSS anomalies · restricted zones · offshore incidents","HIGH"]],
changes:[
["Live-air classification added","Aircraft are grouped into AWACS, tanker, ISR, transport, fighter or other using public type/callsign metadata."],
["Interactive filters","Tap AWACS, tanker, ISR, transport or fighter to isolate that category."],
["Safer data path","v0.3 supports a future proxy endpoint without exposing an API key in the page."],
["Alert engine added","High-interest military-air patterns can trigger device notifications with cooldown/deduplication."],
["Other layers remain demo","Hotspots, infrastructure and GNSS are still analysis/demo layers."]]};
const map=L.map("map",{zoomControl:false}).setView([59.5,19],4);L.control.zoom({position:"bottomright"}).addTo(map);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:10,attribution:"&copy; OpenStreetMap contributors"}).addTo(map);
const G={hotspots:L.layerGroup().addTo(map),military:L.layerGroup().addTo(map),infra:L.layerGroup().addTo(map),gps:L.layerGroup().addTo(map)};
function c(lat,lon,r,col,p,g){L.circle([lat,lon],{radius:r,color:col,weight:1.5,fillColor:col,fillOpacity:.15}).bindPopup(p).addTo(G[g])}
D.hotspots.forEach(h=>{
 function renderHotspots(){
  G.hotspots.clearLayers();
  let col=h[3]>=70?"#ff6b6b":h[3]>=50?"#f7c948":"#55d187";

  let p="<b>"+h[0]+"</b><br>Activity score: "+h[3]+"<br>"+h[4];

  if(h[5]) p+="<br><br><b>Why it matters</b><br>"+h[5];
  if(h[6]) p+="<br><br><b>Watch for</b><br>"+h[6];
  if(h[7]) p+="<br><br><b>Confidence:</b> "+h[7];
}
renderHotspots();
  c(h[1],h[2],45000+h[3]*650,col,p,"hotspots");
});
[[57.72,11.97,"Gothenburg"],[59.33,18.06,"Stockholm"],[60.39,5.32,"Bergen"],[55.67,12.57,"Øresund"]].forEach(x=>c(x[0],x[1],35000,"#55d187","<b>"+x[2]+"</b><br>Critical infrastructure watch · demo","infra"));
[[59.45,27.3,"Narva region"],[59.8,25.9,"Eastern Gulf of Finland"],[58.4,22.5,"Baltic anomaly zone"]].forEach(x=>c(x[0],x[1],85000,"#f7c948","<b>"+x[2]+"</b><br>GPS/GNSS indicator · demo","gps"));

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const fmtAlt=a=>a==="ground"?"ground":(Number.isFinite(+a)?Math.round(+a).toLocaleString()+" ft":"n/a");
const fmtNum=(v,u)=>Number.isFinite(+v)?Math.round(+v)+u:"n/a";
const nordic=a=>Number.isFinite(+a.lat)&&Number.isFinite(+a.lon)&&+a.lat>=53&&+a.lat<=72.5&&+a.lon>=-12&&+a.lon<=34.5;

function classify(a){
  const type=String(a.t||"")
    .toUpperCase()
    .replace(/[^A-Z0-9]/g,"");

  const AWACS=new Set([
    "E3A","E3B","E3C","E3D","E3F",
    "E7A","E7T","A50"
  ]);

  const TANKER=new Set([
    "KC135","K35R","K35E",
    "KC46","K46A"
  ]);

  const ISR=new Set([
    "RC135","R135",
    "P8","P8A",
    "EP3","IL20",
    "EA37"
  ]);

  const TRANSPORT=new Set([
    "C17","C17A",
    "C130","C30J",
    "A400","A400M",
    "C5","C5M",
    "C295","CN35"
  ]);

  const FIGHTER=new Set([
    "F15","F16","F18","F22","F35",
    "JAS39","EUFI","RFAL",
    "SU27","SU30","SU35",
    "MG29","MIG29"
  ]);

  if(AWACS.has(type)) return "awacs";
  if(TANKER.has(type)) return "tanker";
  if(ISR.has(type)) return "isr";
  if(TRANSPORT.has(type)) return "transport";
  if(FIGHTER.has(type)) return "fighter";

  return "other";
}
function iconFor(a,cat){
 const deg=Number.isFinite(+a.track)?+a.track:0;
 return L.divIcon({className:"",html:`<div class="plane cat-${cat}" style="transform:rotate(${deg}deg)">✈</div>`,iconSize:[24,24],iconAnchor:[12,12]});
}



// --- NordicWatch alert engine v0.4 ---
const ALERT_COOLDOWN_MS=30*60*1000;
const ALERT_KEY="NORDICWATCH_ALERTS_ENABLED";
const SEEN_KEY="NORDICWATCH_ALERT_SEEN";
const alertState=document.getElementById("alertState");
const alertsBtn=document.getElementById("alertsBtn");
let swReg=null;

const zones=[
 {name:"Kaliningrad / Baltijsk",lat:54.71,lon:20.51,r:430},
 {name:"Polish Baltic coast",lat:54.60,lon:17.50,r:420},
 {name:"Central Baltic",lat:56.30,lon:18.50,r:500},
 {name:"Gulf of Finland",lat:59.75,lon:25.50,r:420},
 {name:"Suwałki corridor",lat:54.10,lon:23.20,r:350}
];

function kmBetween(lat1,lon1,lat2,lon2){
 const R=6371,toRad=x=>x*Math.PI/180;
 const dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1);
 const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
 return 2*R*Math.asin(Math.sqrt(a));
}
function nearestZone(a){
 let best=null;
 for(const z of zones){
   const d=kmBetween(+a.lat,+a.lon,z.lat,z.lon);
   if(d<=z.r && (!best||d<best.d)) best={...z,d};
 }
 return best;
}
function alertScore(a,all){
 const cat=classify(a),z=nearestZone(a);
 if(!z) return null;
 let score={awacs:62,tanker:48,isr:72,fighter:55,transport:22,other:10}[cat]||10;
 if(z.name==="Kaliningrad / Baltijsk") score+=10;
 if(z.name==="Polish Baltic coast" && cat==="isr") score+=12;
 const nearby=all.filter(b=>b!==a && nearestZone(b)?.name===z.name);
 const cats=new Set(nearby.map(classify));
 if(cats.has("fighter") && cat==="isr") score+=10;
 if(cats.has("awacs")) score+=7;
 if(cats.has("tanker")) score+=5;
 score=Math.min(99,score);
 return {score,cat,zone:z,nearby:[...cats]};
}
// Correlation engine: looks for mission-role combinations inside the same watch zone.
function detectKillChains(all){
 const events=[];
 for(const z of zones){
   const members=all.filter(a=>nearestZone(a)?.name===z.name);
   if(!members.length) continue;
   const by={awacs:[],tanker:[],isr:[],fighter:[],transport:[],other:[]};
   members.forEach(a=>by[classify(a)].push(a));
   let score=0,label="",reason="";
   if(by.isr.length && by.fighter.length && by.awacs.length && by.tanker.length){
     score=96; label="FULL SUPPORT PACKAGE"; reason="ISR + fighter + AWACS + tanker";
   }else if(by.isr.length && by.fighter.length && by.awacs.length){
     score=90; label="ISR / AIR COVER CLUSTER"; reason="ISR + fighter + AWACS";
   }else if(by.isr.length && by.awacs.length && by.tanker.length){
     score=87; label="ISR SUPPORT CLUSTER"; reason="ISR + AWACS + tanker";
   }else if(by.isr.length && by.fighter.length){
     score=82; label="ISR / FIGHTER CORRELATION"; reason="ISR + fighter";
   }else if(by.awacs.length && by.tanker.length && by.fighter.length){
     score=80; label="AIR SUPPORT PACKAGE"; reason="AWACS + tanker + fighter";
   }else if(by.awacs.length && by.tanker.length){
     score=72; label="SUPPORT PAIR"; reason="AWACS + tanker";
   }else continue;
   // Extra weight for the two highest-interest southern Baltic zones.
   if(z.name==="Kaliningrad / Baltijsk") score=Math.min(99,score+3);
   if(z.name==="Polish Baltic coast" && by.isr.length) score=Math.min(99,score+2);
   events.push({zone:z,score,label,reason,members,by});
 }
 return events.sort((a,b)=>b.score-a.score);
}
function clusterId(e){
 const ids=e.members.map(a=>a.hex||(a.flight||"").trim()||a.r||"x").sort().join("-");
 return "cluster:"+e.zone.name+":"+ids;
}
async function notifyCluster(e){
 const level=alertLevel(e.score); if(!level) return;
 const id=clusterId(e); if(!canNotify(id,level)) return;
 const title=`${level==="WATCH"?"🟡":level==="ALERT"?"🟠":"🔴"} NordicWatch ${level} · ${e.label}`;
 const body=`${e.zone.name} · ${e.reason} · score ${e.score}`;
 const opts={body,tag:"nw-"+id,renotify:true,data:{lat:e.zone.lat,lon:e.zone.lon,score:e.score,cluster:true},icon:"icon-192.png",badge:"icon-192.png"};
 try{if(swReg) await swReg.showNotification(title,opts); else if(Notification.permission==="granted") new Notification(title,opts)}catch(err){console.warn("cluster notification",err)}
 prependSignal(level,e.label,`${e.zone.name} · ${e.reason} · score ${e.score}`);
}

function alertLevel(score){return score>=85?"CRITICAL":score>=70?"ALERT":score>=58?"WATCH":null}
function seenMap(){try{return JSON.parse(localStorage.getItem(SEEN_KEY)||"{}")||{}}catch{return {}}}
function canNotify(id,level){
 const m=seenMap(),now=Date.now(),prev=m[id];
 if(prev && now-prev.time<ALERT_COOLDOWN_MS && prev.level===level) return false;
 m[id]={time:now,level};
 for(const [k,v] of Object.entries(m)) if(now-v.time>24*60*60*1000) delete m[k];
 localStorage.setItem(SEEN_KEY,JSON.stringify(m));
 return true;
}
async function notifyEvent(a,e){
 const call=(a.flight||"").trim()||a.r||a.hex||"Military aircraft";
 const level=alertLevel(e.score); if(!level) return;
 const id=(a.hex||call)+":"+e.zone.name;
 if(!canNotify(id,level)) return;
 const title=`${level==="WATCH"?"🟡":level==="ALERT"?"🟠":"🔴"} NordicWatch ${level}`;
 const body=`${e.cat.toUpperCase()} ${call} · ${e.zone.name} · score ${e.score}`;
 const opts={body,tag:"nw-"+id,renotify:true,data:{lat:+a.lat,lon:+a.lon,call,score:e.score},icon:"icon-192.png",badge:"icon-192.png"};
 try{
   if(swReg) await swReg.showNotification(title,opts);
   else if("Notification" in window && Notification.permission==="granted") new Notification(title,opts);
 }catch(err){console.warn("notification",err)}
 prependSignal(level,`${e.cat.toUpperCase()} ${call}`,`${e.zone.name} · activity score ${e.score}`);
}
function prependSignal(meta,title,desc){
 const box=document.getElementById("signals");
 const el=document.createElement("div"); el.className="signal";
 el.innerHTML=`<div class="meta">${esc(meta)} · NOW</div><div class="title">${esc(title)}</div><div class="desc">${esc(desc)}</div>`;
 box.prepend(el); while(box.children.length>8) box.lastElementChild.remove();
}
async function evaluateAlerts(ac){
 if(localStorage.getItem(ALERT_KEY)!=="1" || !("Notification" in window) || Notification.permission!=="granted") return;
 const clusters=detectKillChains(ac);
 for(const e of clusters) await notifyCluster(e);
 // Individual alerts remain useful, but clusters are evaluated first.
 for(const a of ac){ const e=alertScore(a,ac); if(e && e.score>=58) await notifyEvent(a,e); }
}
async function initAlerts(){
 if("serviceWorker" in navigator){try{swReg=await navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}) }catch(e){console.warn("SW",e)}}
 const enabled=localStorage.getItem(ALERT_KEY)==="1";
 alertState.textContent=enabled&&Notification.permission==="granted"?"armed":Notification.permission==="denied"?"blocked":"off";
 alertsBtn.textContent=enabled?"Alerts on":"Enable alerts";
}
alertsBtn.onclick=async()=>{
 if(!("Notification" in window)){alertState.textContent="unsupported";return}
 if(Notification.permission!=="granted"){
   const p=await Notification.requestPermission(); if(p!=="granted"){alertState.textContent=p;return}
 }
 const on=localStorage.getItem(ALERT_KEY)!=="1";
 localStorage.setItem(ALERT_KEY,on?"1":"0"); alertsBtn.textContent=on?"Alerts on":"Enable alerts"; alertState.textContent=on?"armed":"off";
 if(on) await evaluateAlerts(rawAircraft);
};
initAlerts();

let rawAircraft=[],activeFilter="all";
function renderAircraft(){
 G.military.clearLayers();
 const ac=rawAircraft.filter(a=>activeFilter==="all"||classify(a)===activeFilter);
 ac.forEach(a=>{
   const cat=classify(a), call=(a.flight||"").trim()||a.r||a.hex||"Unknown";
   const popup=`<b>${esc(call)}</b><br>Category: ${esc(cat.toUpperCase())}<br>Type: ${esc(a.t||"n/a")}<br>Registration: ${esc(a.r||"n/a")}<br>Altitude: ${esc(fmtAlt(a.alt_baro))}<br>Speed: ${esc(fmtNum(a.gs," kt"))}<br>Track: ${esc(fmtNum(a.track,"°"))}<br>Hex: ${esc(a.hex||"n/a")}<br>Source classification: military`;
   L.marker([+a.lat,+a.lon],{icon:iconFor(a,cat),title:call}).bindPopup(popup).addTo(G.military);
 });
 document.getElementById("adsbStatus").textContent=(activeFilter==="all"?rawAircraft.length:ac.length)+" shown";
}

async function fetchJSON(url){
 const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),9000);
 try{const r=await fetch(url,{cache:"no-store",signal:ctrl.signal});if(!r.ok)throw new Error("HTTP "+r.status);return await r.json()}finally{clearTimeout(t)}
}
async function loadMilitary(){
 const st=document.getElementById("adsbStatus"),up=document.getElementById("adsbUpdated"); st.textContent="loading…";
 // Optional future proxy: set localStorage.NORDICWATCH_ADSB_PROXY to e.g. https://your-worker.example/mil
 const proxy="https://nordicwatch-proxy.rospiggen.workers.dev";
 const urls=[proxy,"https://api.adsb.lol/v2/mil"].filter(Boolean);
 let lastErr=null;
 for(const url of urls){
   try{
     const j=await fetchJSON(url);
     rawAircraft=(j.ac||j.aircraft||[]).filter(nordic);
     renderAircraft();
     await evaluateAlerts(rawAircraft);
     up.textContent="Updated "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});
     return;
   }catch(e){lastErr=e}
 }
 rawAircraft=[];G.military.clearLayers();st.textContent="feed unavailable";up.textContent="Map remains operational";console.error(lastErr);
}
loadMilitary();setInterval(loadMilitary,30000);

document.querySelectorAll("#filters button").forEach(b=>b.onclick=()=>{

});
