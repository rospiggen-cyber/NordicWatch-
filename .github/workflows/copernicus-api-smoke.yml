name: Copernicus actual API smoke
on:
  push:
    branches:
      - feature/earth-observation-cems-v01
    paths:
      - "tools/copernicus-api-smoke.mjs"
      - ".github/workflows/copernicus-api-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tools/copernicus-api-smoke.mjs
