name: Update Copernicus public mapping snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "12 */6 * * *"
  push:
    branches: [main]
    paths:
      - "tools/copernicus-sync.mjs"
      - "earth-observation-core.js"
      - ".github/workflows/copernicus-sync.yml"

permissions:
  contents: write

concurrency:
  group: copernicus-public-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run official source collection
        run: |
          node --check tools/copernicus-sync.mjs
          node tools/copernicus-sync.mjs
      - name: Commit public snapshot only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/copernicus-activations.json
          if git diff --cached --quiet; then
            echo "No catalogue change"
            exit 0
          fi
          git commit -m "data: refresh official Copernicus mapping catalogue"
          git push origin HEAD:main
