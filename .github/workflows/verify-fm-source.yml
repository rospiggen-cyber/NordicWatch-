name: Verify Swedish Armed Forces original feed
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/verify-fm-source.mjs"
      - "tools/verify-fm-website.mjs"
      - "cloudflare/fm-website-collector.mjs"
      - ".github/workflows/verify-fm-source.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tools/verify-fm-source.mjs
      - run: node tools/verify-fm-website.mjs
