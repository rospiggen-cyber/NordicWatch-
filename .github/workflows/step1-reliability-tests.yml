name: Step 1 reliability tests

on:
  push:
    branches:
      - codex/step1-news-event-reliability
  pull_request:
    paths:
      - "cloudflare/event-feed-worker.js"
      - "cloudflare/news-reliability-core.mjs"
      - "external-report-core.mjs"
      - "news-routing.js"
      - "news-freshness.js"
      - "situational-engine.js"
      - "validation-lab.js"
      - "validation-lab.html"
      - "tests/validation-lab.test.js"
      - "teach-nordicwatch.js"
      - "teach-ui.js"
      - "teach-persistence.js"
      - "tests/teach-persistence.test.js"
      - "sw.js"
      - "cascade-engine.js"
      - "cascade-lab.js"
      - "cascade-lab.html"
      - "tests/cascade-lab.test.js"
      - "tests/teach-nordicwatch.test.js"
      - "intelligence-core.js"
      - "brief-engine.js"
      - "situation-engine.js"
      - "situation-ui.js"
      - "regional-delta.js"
      - "index.html"
      - "tests/news-reliability.test.mjs"
      - "tests/event-discovery.test.mjs"
      - "tests/finland-civil-restrictions.test.mjs"
      - "cloudflare/event-discovery-core.mjs"
      - "tests/news-routing.test.js"
      - "tests/external-report.test.mjs"
      - "tests/situation-engine.test.js"
      - "tests/situation-evidence.test.js"
      - "tests/regional-delta.test.js"
      - "tests/brief-coverage.test.js"
      - ".github/workflows/step1-reliability-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax checks
        run: |
          node --check cloudflare/news-reliability-core.mjs
          node --check external-report-core.mjs
          node --check news-routing.js
          node --check situational-engine.js
          node --check validation-lab.js
          node --check teach-nordicwatch.js
          node --check teach-ui.js
          node --check teach-persistence.js
          node --check cascade-engine.js
          node --check cascade-lab.js
          node --check cloudflare/event-feed-worker.js
          node --check intelligence-core.js
          node --check brief-engine.js
          node --check situation-engine.js
          node --check situation-ui.js
          node --check regional-delta.js
      - name: Regression tests
        run: |
          node --test tests/news-reliability.test.mjs tests/news-routing.test.js tests/teach-nordicwatch.test.js tests/teach-persistence.test.js tests/cascade-lab.test.js tests/external-report.test.mjs tests/event-discovery.test.mjs tests/finland-civil-restrictions.test.mjs
          node --test tests/situation-engine.test.js tests/situation-evidence.test.js tests/regional-delta.test.js tests/brief-coverage.test.js
          node --test tests/situational-engine.test.js tests/validation-lab.test.js
