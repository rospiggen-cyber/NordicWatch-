name: Earth Observation production read-only health

on:
  push:
    branches: [main]
    paths:
      - "tools/copernicus-production-health.mjs"
      - ".github/workflows/copernicus-production-health.yml"
  workflow_dispatch:

permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tools/copernicus-production-health.mjs
